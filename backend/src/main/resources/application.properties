spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resume_builder}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.main.allow-circular-references=${SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES:true}
server.tomcat.max-http-form-post-size=${SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE:0}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:30s}
spring.codec.max-in-memory-size=${SPRING_CODEC_MAX_IN_MEMORY_SIZE:10MB}
